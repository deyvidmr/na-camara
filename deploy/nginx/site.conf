# Porta pública do projeto. Só leitura, com limite de acessos por IP.
# O banco e a API ficam atrás, acessíveis apenas pela rede interna do Docker.
# As rotas ficam em rotas.inc.

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=site:10m rate=30r/s;
limit_req_status 429;

server_tokens off;

# HTTP: só o desafio do Let's Encrypt; o resto (inclusive acesso pelo IP) vai para o HTTPS.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://nacamara.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name nacamara.duckdns.org;

    # certificado emitido pelo serviço certbot (docker compose run --rm certbot ...)
    ssl_certificate /etc/letsencrypt/live/nacamara.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nacamara.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;

    include /etc/nginx/conf.d/rotas.inc;
}
