name: civico
version: "0.1.0"
profile: civico

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  civico:
    staging:
      +schema: staging
      +materialized: view
    core:
      +schema: core
      +materialized: table
    app:
      +schema: app
      +materialized: view

seeds:
  civico:
    +schema: editorial
    tema_cidadao_tema_oficial:
      +column_types:
        cod_tema: int
    tema_cidadao:
      +column_types:
        ordem: int
